<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#e9f2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#40556f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#198754"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 18px Arial, sans-serif; fill: #526071; }
      .section { font: 700 24px Arial, sans-serif; fill: #23364d; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #172033; }
      .body { font: 16px Arial, sans-serif; fill: #344256; }
      .small { font: 14px Arial, sans-serif; fill: #526071; }
      .step { font: 700 16px Arial, sans-serif; fill: white; }
      .arrow-label { font: 700 14px Arial, sans-serif; fill: #40556f; }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
      .line { fill: none; stroke: #40556f; stroke-width: 3; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #198754; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <text x="70" y="65" class="title">9 Men's Morris: Free Deployment, Authentication and Online Play</text>
  <text x="70" y="98" class="subtitle">Git push deploys the website; Supabase authenticates users and synchronizes private two-player rooms.</text>

  <rect x="55" y="130" width="1490" height="365" rx="25" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/>
  <text x="85" y="170" class="section">A. One-time setup and automatic deployment</text>

  <circle cx="105" cy="224" r="23" fill="#40556f"/><text x="100" y="230" class="step">1</text>
  <rect x="145" y="195" width="250" height="115" class="box" fill="#eef2f7" stroke="#778aa3"/>
  <text x="170" y="228" class="box-title">Local project</text>
  <text x="170" y="257" class="body">HTML, CSS, JavaScript</text>
  <text x="170" y="281" class="small">wrangler.jsonc + config</text>

  <circle cx="460" cy="224" r="23" fill="#40556f"/><text x="455" y="230" class="step">2</text>
  <rect x="500" y="195" width="260" height="115" class="box" fill="#f3f0fa" stroke="#7665a8"/>
  <text x="525" y="228" class="box-title">Personal GitHub repo</text>
  <text x="525" y="257" class="body">Atanug3/9morris</text>
  <text x="525" y="281" class="small">Push main branch</text>

  <circle cx="825" cy="224" r="23" fill="#40556f"/><text x="820" y="230" class="step">3</text>
  <rect x="865" y="195" width="270" height="115" class="box" fill="#fff3e8" stroke="#e1852d"/>
  <text x="890" y="228" class="box-title">Cloudflare Worker</text>
  <text x="890" y="257" class="body">Automatic Git build</text>
  <text x="890" y="281" class="small">Free HTTPS workers.dev URL</text>

  <circle cx="1200" cy="224" r="23" fill="#40556f"/><text x="1195" y="230" class="step">4</text>
  <rect x="1240" y="195" width="250" height="115" class="box" fill="#e9f7ef" stroke="#2f9e68"/>
  <text x="1265" y="228" class="box-title">Public website</text>
  <text x="1265" y="257" class="body">9morris-personal...</text>
  <text x="1265" y="281" class="small">Available worldwide</text>

  <path d="M395 252 L500 252" class="line"/>
  <path d="M760 252 L865 252" class="line"/>
  <path d="M1135 252 L1240 252" class="line"/>
  <text x="415" y="239" class="arrow-label">git push</text>
  <text x="776" y="239" class="arrow-label">build + deploy</text>
  <text x="1155" y="239" class="arrow-label">HTTPS</text>

  <rect x="145" y="350" width="990" height="105" rx="16" fill="#f8fbfd" stroke="#9bb0c4" stroke-width="2"/>
  <text x="170" y="382" class="box-title">Supabase project setup</text>
  <text x="170" y="411" class="body">Run supabase-schema.sql  •  Enable RLS  •  Configure Site/Redirect URL  •  Add publishable key to browser config</text>
  <text x="170" y="436" class="small">Database password, service-role/secret key and OAuth client secrets are never committed.</text>

  <rect x="1180" y="350" width="310" height="105" rx="16" fill="#fff8df" stroke="#d5a928" stroke-width="2"/>
  <text x="1205" y="382" class="box-title">OAuth provider setup</text>
  <text x="1205" y="411" class="body">Google + GitHub client IDs</text>
  <text x="1205" y="436" class="small">Secrets stored only in Supabase</text>
  <path d="M1180 402 L1135 402" class="line"/>

  <rect x="55" y="525" width="1490" height="400" rx="25" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/>
  <text x="85" y="565" class="section">B. What happens when two people play online</text>

  <rect x="100" y="610" width="250" height="150" class="box" fill="#eaf3ff" stroke="#3478c7"/>
  <text x="125" y="644" class="box-title">Player 1 device</text>
  <text x="125" y="674" class="body">1. Open website</text>
  <text x="125" y="700" class="body">2. Sign in</text>
  <text x="125" y="726" class="body">3. Create private room</text>

  <rect x="1250" y="610" width="250" height="150" class="box" fill="#fff0f2" stroke="#b23b55"/>
  <text x="1275" y="644" class="box-title">Player 2 device</text>
  <text x="1275" y="674" class="body">1. Open invite link</text>
  <text x="1275" y="700" class="body">2. Sign in separately</text>
  <text x="1275" y="726" class="body">3. Join room code</text>

  <rect x="490" y="600" width="260" height="160" class="box" fill="#fff8e8" stroke="#d29b22"/>
  <text x="515" y="634" class="box-title">Google / GitHub</text>
  <text x="515" y="664" class="body">Verify user identity</text>
  <text x="515" y="690" class="small">OAuth callback goes to</text>
  <text x="515" y="713" class="small">Supabase Auth</text>
  <text x="515" y="738" class="small">Same verified email = one user</text>

  <rect x="850" y="600" width="290" height="230" class="box" fill="#eaf8f1" stroke="#2f9e68"/>
  <text x="875" y="634" class="box-title">Supabase</text>
  <text x="875" y="665" class="body">Auth</text>
  <text x="925" y="665" class="small">issues user session/JWT</text>
  <text x="875" y="695" class="body">Postgres</text>
  <text x="955" y="695" class="small">stores rooms + state</text>
  <text x="875" y="725" class="body">Realtime</text>
  <text x="950" y="725" class="small">sends joins + moves</text>
  <text x="875" y="755" class="body">RLS</text>
  <text x="915" y="755" class="small">participants only</text>
  <text x="875" y="785" class="small">Turn + revision checks prevent</text>
  <text x="875" y="807" class="small">out-of-turn or conflicting writes</text>

  <path d="M350 650 C410 615 435 620 490 650" class="line"/>
  <path d="M1250 650 C1200 615 1180 620 1140 650" class="line"/>
  <path d="M750 680 L850 680" class="green-line"/>
  <text x="770" y="666" class="arrow-label">identity</text>

  <path d="M350 720 C560 885 720 865 850 770" class="green-line"/>
  <path d="M1250 720 C1200 875 1145 870 1085 830" class="green-line"/>
  <text x="475" y="850" class="arrow-label">create room / send move</text>
  <text x="1100" y="860" class="arrow-label">join / send move</text>

  <path d="M850 745 C700 800 520 800 350 745" class="line dash"/>
  <path d="M1140 745 C1180 785 1210 785 1250 745" class="line dash"/>
  <text x="535" y="790" class="arrow-label">Realtime update + 4-second polling fallback</text>

  <rect x="95" y="865" width="1405" height="120" rx="18" fill="#f2f7fa" stroke="#8aa3b7" stroke-width="2"/>
  <text x="125" y="900" class="box-title">Security boundary</text>
  <text x="125" y="930" class="body">Safe in browser/Git: Supabase project URL + sb_publishable key. These identify the public web application; RLS controls data access.</text>
  <text x="125" y="958" class="body">Never expose: sb_secret/service_role key, database password, Google client secret or GitHub client secret.</text>

  <text x="800" y="1022" text-anchor="middle" class="small">Setup result: free static hosting + federated login + private room codes + synchronized play across two devices</text>
</svg>
